services:
  bot:
    build: .
    env_file:
      - Bot.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./schedule.csv:/app/schedule.csv
      - ./Bot.env:/app/Bot.env
    ports:
      - "5000:5000"
      - "8000:8000"

  db:
    image: postgres:13
    environment:
      TZ: Asia/Yekaterinburg
    env_file:
      - Bot.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: